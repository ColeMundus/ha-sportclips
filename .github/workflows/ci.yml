name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: minimum
            core: '2026.10.0'
            harness: pytest-homeassistant-custom-component
            harness-version: '0.13.371'
            aiohttp: '3.14.4'
          - lane: latest
            core: '2026.11.0'
            harness: pytest-homeassistant
            harness-version: '2026.11.0'
            aiohttp: '3.14.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.19'
          python-version: '3.14.7'
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group dev --group "${LANE}"
        env:
          LANE: ${{ matrix.lane }}
      - run: uv pip check
      - name: Verify target framework
        env:
          CORE: ${{ matrix.core }}
          HARNESS: ${{ matrix.harness }}
          HARNESS_VERSION: ${{ matrix.harness-version }}
          AIOHTTP: ${{ matrix.aiohttp }}
        run: |
          uv run --no-sync python scripts/check_framework.py
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - name: Actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - run: git diff --check
      - run: uv run --no-sync python -m pytest --cov=custom_components.sportclips --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=95
      - run: uv run --no-sync python scripts/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sportclips-manual-install-${{ matrix.lane }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361
  hacs:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
  required:
    if: always()
    needs: [checks, hassfest, hacs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_ci.py
        env:
          NEEDS: ${{ toJSON(needs) }}
          PRIVATE: ${{ toJSON(github.event.repository.private) }}
