[project]
name = "ha-sportclips"
version = "0.1.0b3"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
dev = [
 "ruff==0.14.3",
 "mypy==2.4.1",
 "pytest-cov==7.1.0",
]
minimum = [
 "homeassistant==2026.10.0",
 "pytest-homeassistant-custom-component==0.13.371",
]
latest = [
 "homeassistant==2026.11.0",
 "pytest-homeassistant==2026.11.0",
]

[tool.uv]
default-groups = ["dev", "minimum"]
conflicts = [[{ group = "minimum" }, { group = "latest" }]]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx --disable-socket --allow-unix-socket"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/sportclips"]
follow_imports = "silent"
